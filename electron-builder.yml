appId: de.yousri.gateh
productName: Gate-H
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!docs/**'
  - '!docker/**'
  - '!build-desktop.sh'
  - '!scripts/**'
asarUnpack:
  - resources/**
win:
  executableName: Gate-H
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
# Built natively on each architecture (see .github/workflows/macos.yml): native modules are
# installed for the host arch only (npmRebuild: false below). No Developer ID yet, so the app is
# ad-hoc signed and not notarized - Gatekeeper asks before the first launch (see README).
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  # The zip's name; the dmg's own artifactName below takes precedence for the dmg.
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  # Ad-hoc ("-"): Apple Silicon won't run unsigned code, and electron-builder no longer falls back
  # to ad-hoc by itself. With the hardened runtime this needs disable-library-validation in the
  # entitlements, or the pre-signed Electron frameworks fail to load. A Developer ID replaces "-".
  identity: '-'
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  # Replaces the top-level list, so resources/** is repeated. node-pty runs a separate spawn-helper
  # executable on macOS, next to its pty.node - both have to live outside the asar archive, or
  # every PTY session fails with "posix_spawnp failed".
  asarUnpack:
    - resources/**
    - node_modules/node-pty/prebuilds/**
    - node_modules/node-pty/build/Release/**
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
  maintainer: ahmedyousrisobhi
  category: Utility
appImage:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
